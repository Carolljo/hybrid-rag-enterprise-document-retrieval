services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      RAG_API_URL: http://api:8000/ask
    ports:
      - "8501:8501"
    depends_on:
      - api